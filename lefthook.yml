# Git hooks (skill local-ci): L0 on commit, L1 on push. Install: `mise install && mise x -- lefthook install`.
pre-commit:
  parallel: true
  jobs:
    - name: secrets
      run: mise x -- gitleaks git --staged --redact --no-banner .
    - name: lint
      run: mise x -- npx eslint {staged_files}
      glob: "*.{js,mjs,ts,tsx}"
    - name: typos
      run: mise x -- typos --force-exclude {staged_files}
    - name: actionlint
      run: mise x -- actionlint {staged_files}
      glob: ".github/workflows/*.{yml,yaml}"

commit-msg:
  jobs:
    - name: conventional commit subject
      run: sh scripts/check-commit-msg.sh {1}

pre-push:
  jobs:
    - name: just check (L1)
      run: mise x -- just check
