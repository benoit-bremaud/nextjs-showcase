sonar.projectKey=nextjs-showcase
sonar.projectName=nextjs-showcase
sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=src/**/*.test.ts,e2e/**/*.spec.ts
sonar.exclusions=src/**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.host.url=http://localhost:9000
# Route segments and components are covered by Playwright (e2e/), not by unit coverage
sonar.coverage.exclusions=src/app/**
